<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FTFU /local OG Image — 1200 × 630</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #111110;
    color: #EDEAE2;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px 80px;
    position: relative;
  }

  .strike-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 8px;
    background: #C8A200;
  }

  .top {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 8px;
  }

  .strike-square {
    width: 72px;
    height: 72px;
    background: #C8A200;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .strike-square span {
    font-family: 'Bitter', Georgia, serif;
    font-weight: 700;
    font-size: 22px;
    color: #111110;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #C8A200;
  }

  .eyebrow .dot {
    display: inline-block;
    color: #6B6965;
    margin: 0 14px;
  }

  .center {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  h1.title {
    font-family: 'Bitter', Georgia, serif;
    font-weight: 700;
    font-size: 92px;
    line-height: 0.98;
    letter-spacing: -0.03em;
    color: #EDEAE2;
    margin-bottom: 26px;
    text-transform: uppercase;
  }

  h1.title em {
    font-style: italic;
    font-weight: 400;
    color: #C8A200;
  }

  .tagline {
    font-family: 'Bitter', Georgia, serif;
    font-weight: 400;
    font-style: italic;
    font-size: 26px;
    line-height: 1.35;
    color: #EDEAE2;
    opacity: 0.92;
    max-width: 980px;
  }

  .strike-rule {
    width: 64px;
    height: 4px;
    background: #C8A200;
    margin-top: 28px;
    margin-bottom: 18px;
  }

  .author {
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #6B6965;
  }

  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .url {
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #EDEAE2;
  }

  .url-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: #C8A200;
    margin-right: 12px;
    vertical-align: middle;
    border-radius: 50%;
  }

  .corner-meta {
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #6B6965;
  }
</style>
</head>
<body>

  <div class="strike-top"></div>

  <div class="top">
    <div class="strike-square"><span>FTFU</span></div>
    <div class="eyebrow">Free 7-Part Series<span class="dot">·</span>Every Tuesday</div>
  </div>

  <div class="center">
    <h1 class="title">How to Market<br>Your <em>Local</em> Business.</h1>
    <p class="tagline">Seven weekly issues. Seven free resources. One bundled playbook at the end.</p>
    <div class="strike-rule"></div>
    <p class="author">From The Floor Up &nbsp;·&nbsp; By Daris Wilson</p>
  </div>

  <div class="bottom">
    <div class="url"><span class="url-dot"></span>fromthefloorup.co/local</div>
    <div class="corner-meta">Tactical · Vertical-Agnostic</div>
  </div>

</body>
</html>
